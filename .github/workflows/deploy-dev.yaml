name: Deploy to DEV

on:
  push:
    branches:
      - dev

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_DEV }}
  IMAGE_REPO: apps

jobs:
  deploy-dev:
    name: Build & Deploy new-member-onboarding-app (DEV)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (DEV)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify GCP Authentication
        run: |
          echo "Verifying GCP authentication..."
          gcloud auth list
          gcloud config get-value project
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Build Docker image for new-member-onboarding-app
        run: |
          SERVICE="new-member-onboarding-app"
          IMAGE="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPO}/${SERVICE}:${GITHUB_SHA}"

          echo "Building image: $IMAGE from root Dockerfile with repo root as context"

          # Build from repo root so pnpm-workspace.yaml & packages are available
          gcloud builds submit . \
            --tag "$IMAGE" \
            --project="$GCP_PROJECT_ID"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run (DEV)
        run: |
          echo "Deploying $SERVICE to Cloud Run in $GCP_REGION..."

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --project="$GCP_PROJECT_ID"