name: Deploy apps to DEV

on:
  push:
    branches:
      - dev   # only deploy from dev; prod can use a separate workflow later

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get changed files
        id: changes
        run: |
          git fetch --unshallow || true

          echo "HEAD revision:"
          git rev-parse HEAD

          # If there is a previous commit, diff HEAD^..HEAD; otherwise, treat all files as changed
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "Using diff: HEAD^..HEAD"
            git diff --name-only HEAD^ HEAD > changed_files.txt
          else
            echo "No parent commit (first commit on branch). Using HEAD only."
            git diff --name-only HEAD > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true

      - name: Deploy changed apps
        run: |
          CHANGED_PATHS=$(cat changed_files.txt || echo "")

          if [ -z "$CHANGED_PATHS" ]; then
            echo "No changed files detected. Skipping deploy."
            exit 0
          fi

          echo "Changed paths:"
          echo "$CHANGED_PATHS"

          # Map app directories in repo -> Cloud Run service names
          declare -A app_map

          # ====== REGISTER APPS HERE ======
          # Example:
          # app_map["domains/memberships/membership-app"]="membership-app"
          # app_map["domains/finance/reimbursements-app"]="reimbursements-app"

          # TODO: add your real apps to this mapping
          app_map["domains/memberships/new-member-onboarding-app"]="new-member-onboarding-app"

          # ================================

          # Set project
          gcloud config set project ${{ secrets.GCP_PROJECT_ID_DEV }}

          changed_any=false

          for path in "${!app_map[@]}"; do
            service="${app_map[$path]}"

            # If any changed file is under this path, deploy that service
            if echo "$CHANGED_PATHS" | grep -q "^$path"; then
              changed_any=true
              echo "Detected changes in $path -> deploying Cloud Run service: $service"

              gcloud run deploy "$service" \
                --source "$path" \
                --region us-central1 \
                --platform managed \
                --allow-unauthenticated
                --quiet
            fi
          done

          if [ "$changed_any" = false ]; then
            echo "No app folders in app_map changed. Nothing to deploy."
          fi
