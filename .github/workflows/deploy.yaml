# .github/workflows/deploy.yaml
name: Deploy Apps to Cloud Run

on:
  push:
    branches:
      - prod

env:
  GCP_REGION: us-central1
  # Used to use dev, but is now from prod.
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_PROD }}
  IMAGE_REPO: apps
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy Changed Apps
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}
          token_format: "access_token"
          access_token_lifetime: "3600s"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID_PROD }}

      - name: Debug GCP auth
        run: |
          echo "Active gcloud account:"
          gcloud auth list
          echo "Current project:"
          gcloud config get-value project

      - name: Determine changed apps
        id: changed
        run: |
          git fetch --unshallow || true

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push on branch: just inspect this commit
            git diff --name-only "$AFTER" > changed_files.txt || echo "" > changed_files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt || echo "" > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true

          # Find which app directories under apps/ changed
          APPS=$(grep '^apps/' changed_files.txt | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)

          echo "Detected apps: $APPS"

          if [ -z "$APPS" ]; then
            echo "apps=" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & deploy changed apps
        if: steps.changed.outputs.apps != ''
        run: |
          set -euo pipefail

          APPS="${{ steps.changed.outputs.apps }}"

          echo "Apps to deploy: $APPS"

          for APP in $APPS; do
            echo "::group::Applying IAM for $APP"
            node scripts/apply-iam.js --app "$APP" --project "${GCP_PROJECT_ID_PROD}"
            echo "::endgroup::"

            SERVICE="$APP"
            IMAGE="us-central1-docker.pkg.dev/${GCP_PROJECT_ID_PROD}/${IMAGE_REPO}/${APP}:${GITHUB_SHA}"
          
            echo "::group::Building image for $APP"
          
            gcloud builds submit . \
              --project="$GCP_PROJECT_ID_PROD" \
              --config=infra/cloudbuild.docker.yaml \
              --substitutions=_APP="$APP",_IMAGE="$IMAGE"
          
            echo "::endgroup::"

            echo "::group::Deploying $SERVICE to Cloud Run"
            gcloud run deploy "$SERVICE" \
              --image="$IMAGE" \
              --region="$GCP_REGION" \
              --platform=managed \
              --project="$GCP_PROJECT_ID_PROD" \

            echo "=== Wiring IAP + domain access for $SERVICE ==="

            gcloud run services add-iam-policy-binding "$SERVICE" \
              --region "$REGION" \
              --member="domain:polishyouth.org" \
              --role="roles/run.invoker" \
              --project="$GCP_PROJECT_ID_PROD" \
              --quiet
            
            echo "::endgroup::"
          done

      - name: No app changes
        if: steps.changed.outputs.apps == ''
        run: |
          echo "No app directories under apps/ changed. Skipping deploy."
