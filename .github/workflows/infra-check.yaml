name: Infra Check

on:
  pull_request:
    branches:
      - main

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_DEV }}
  IMAGE_REPO: apps

jobs:
  infra-check:
    name: Validate / Create Infra for Changed Apps
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: "access_token"
          access_token_lifetime: "3600s"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Debug GCP auth
        run: |
          echo "Active gcloud account:"
          gcloud auth list
          echo "Current project:"
          gcloud config get-value project

      - name: Determine changed apps in PR
        id: changed
        run: |
          set -euo pipefail

          # Get base and head SHAs for this PR
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA:  $BASE_SHA"
          echo "Head SHA:  $HEAD_SHA"

          # Make sure both SHAs are available locally
          git fetch origin "$BASE_SHA" "$HEAD_SHA" || true

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt || echo "" > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt || true

          # Detect which app dirs under apps/ changed
          APPS=$(grep '^apps/' changed_files.txt | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)

          echo "Detected changed apps: $APPS"

          if [ -z "$APPS" ]; then
            echo "apps=" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure required infra for changed apps
        if: steps.changed.outputs.apps != ''
        run: |
          set -euo pipefail

          APPS="${{ steps.changed.outputs.apps }}"
          PROJECT="$GCP_PROJECT_ID"
          REGION="$GCP_REGION"
          REPO="$IMAGE_REPO"

          echo "Apps needing infra check: $APPS"

          echo "Enabling required APIs (idempotent)..."
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            --project="$PROJECT"

          echo "Checking Artifact Registry repo: $REPO in $REGION"
          if ! gcloud artifacts repositories describe "$REPO" \
               --location="$REGION" \
               --project="$PROJECT" > /dev/null 2>&1; then
            echo "Repo $REPO not found, creating..."
            gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --description="Shared app container repository" \
              --project="$PROJECT"
          else
            echo "Repo $REPO already exists."
          fi

          # Per-app checks
          for APP in $APPS; do
            echo "-----"
            echo "Checking infra for app: $APP"

            SECRET_NAME="app-${APP}-config"

            echo "Checking Secret Manager secret: $SECRET_NAME"
            if ! gcloud secrets describe "$SECRET_NAME" --project="$PROJECT" > /dev/null 2>&1; then
              echo "Secret $SECRET_NAME not found, creating with empty JSON payload..."
              echo -n '{}' | gcloud secrets create "$SECRET_NAME" \
                --project="$PROJECT" \
                --data-file=- \
                --replication-policy="automatic"
            else
              echo "Secret $SECRET_NAME already exists."
            fi

            IAM_FILE=$(node - <<'NODE' "$APP"
const fs = require("fs");
const path = require("path");
function readAppsYaml(filePath) {
  const lines = fs.readFileSync(filePath, "utf8").split(/\r?\n/);
  const apps = [];
  let current = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    if (line === "apps:") continue;
    if (line.startsWith("- ")) {
      if (current && current.id) apps.push(current);
      current = {};
      const rest = line.slice(2);
      if (rest.includes(":")) {
        const [k, ...v] = rest.split(":");
        current[k.trim()] = v.join(":").trim().replace(/^"|"$/g, "");
      }
      continue;
    }
    if (!current) continue;
    const [k, ...v] = line.split(":");
    if (!k || v.length === 0) continue;
    current[k.trim()] = v.join(":").trim().replace(/^"|"$/g, "");
  }
  if (current && current.id) apps.push(current);
  return apps;
}
const appId = process.argv[2];
const apps = readAppsYaml(path.join("infra", "apps.yaml"));
const app = apps.find((a) => a.id === appId);
if (app && app.iam_file) {
  console.log(app.iam_file);
}
NODE
)

            SERVICE_ACCOUNT=""
            if [ -n "$IAM_FILE" ] && [ -f "$IAM_FILE" ]; then
              SERVICE_ACCOUNT=$(node - <<'NODE' "$IAM_FILE" "$PROJECT"
const fs = require("fs");
const manifest = fs.readFileSync(process.argv[2], "utf8");
const projectId = process.argv[3];
let serviceAccount = "";
for (const raw of manifest.split(/\r?\n/)) {
  const line = raw.trim();
  if (!line || line.startsWith("#")) continue;
  if (line.startsWith("serviceAccount:")) {
    serviceAccount = line.split(":").slice(1).join(":").trim().replace(/PROJECT_ID/g, projectId);
    break;
  }
}
console.log(serviceAccount);
NODE
)
            fi

            if [ -n "$SERVICE_ACCOUNT" ]; then
              echo "Ensuring service account $SERVICE_ACCOUNT exists"
              if ! gcloud iam service-accounts describe "$SERVICE_ACCOUNT" --project="$PROJECT" > /dev/null 2>&1; then
                ACCOUNT_ID=$(echo "$SERVICE_ACCOUNT" | cut -d@ -f1)
                gcloud iam service-accounts create "$ACCOUNT_ID" \
                  --project="$PROJECT" \
                  --display-name="${APP} service account"
              fi

              echo "Ensuring Cloud Run service $APP uses $SERVICE_ACCOUNT"
              if gcloud run services describe "$APP" --region="$REGION" --project="$PROJECT" > /dev/null 2>&1; then
                CURRENT_SA=$(gcloud run services describe "$APP" --region="$REGION" --project="$PROJECT" --format="value(spec.template.spec.serviceAccountName)")
                if [ -z "$CURRENT_SA" ] || [ "$CURRENT_SA" != "$SERVICE_ACCOUNT" ]; then
                  gcloud run services update "$APP" \
                    --region="$REGION" \
                    --project="$PROJECT" \
                    --service-account="$SERVICE_ACCOUNT"
                else
                  echo "$APP already uses $SERVICE_ACCOUNT"
                fi
              else
                echo "Cloud Run service $APP not found yet; will set service account on first deploy."
              fi

              echo "Adding IAM policy binding for secret: $SECRET_NAME"
              gcloud secrets add-iam-policy-binding "$SECRET_NAME" \
                --project="$PROJECT" \
                --member="serviceAccount:$SERVICE_ACCOUNT" \
                --role="roles/secretmanager.secretAccessor"
            else
              echo "No service account declared for $APP. Skipping secret binding."
            fi

          done

          echo "✅ Infra check completed successfully."

      - name: No app changes
        if: steps.changed.outputs.apps == ''
        run: |
          echo "No app directories under apps/ changed. Skipping infra checks."
