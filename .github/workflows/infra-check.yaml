name: Infra Check

on:
  pull_request:
    branches:
      - prod

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_PROD }}
  IMAGE_REPO: apps

jobs:
  infra-check:
    name: Validate / Create Infra for Changed Apps
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "event_name=${{ github.event_name }}"
          echo "workflow=${{ github.workflow }}"
          echo "actor=${{ github.actor }}"

      - name: Debug PR context
        run: |
          echo "base_ref=${{ github.base_ref }}"
          echo "head_ref=${{ github.head_ref }}"

      - name: Debug workspace
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort
      
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}
          token_format: "access_token"
          access_token_lifetime: "3600s"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Debug GCP auth
        run: |
          set -euo pipefail
          echo "Active gcloud account:"
          gcloud auth list
          echo "Current project:"
          gcloud config get-value project

      - name: Determine changed apps in PR
        id: changed
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA:  $BASE_SHA"
          echo "Head SHA:  $HEAD_SHA"

          git fetch origin "$BASE_SHA" "$HEAD_SHA" || true

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt || echo "" > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt || true

          APPS=$(grep '^apps/' changed_files.txt | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)

          echo "Detected changed apps: $APPS"

          if [ -z "${APPS:-}" ]; then
            echo "apps=" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure required infra for changed apps
        if: steps.changed.outputs.apps != ''
        shell: bash
        run: |
          set -euo pipefail

          APPS="${{ steps.changed.outputs.apps }}"
          PROJECT="${GCP_PROJECT_ID}"
          REGION="${GCP_REGION}"
          REPO="${IMAGE_REPO}"

          echo "Apps needing infra check: $APPS"

          # ---- helpers (bash/awk YAML extraction; assumes simple key/value YAML) ----
          # Reads infra/apps.yaml and returns iam_file for the given app id
          get_iam_file_for_app() {
            local app_id="$1"
            local yaml_path="infra/apps.yaml"
          
            if [ ! -f "$yaml_path" ]; then
              echo ""
              return 0
            fi
          
            awk -v app="$app_id" '
              function trim(s){ gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              {
                line = $0
                sub(/^[ \t]*/, "", line)
          
                # Match list entry id line: "- id: app"
                if (line ~ /^-+[ \t]*id:[ \t]*/) {
                  id = line
                  sub(/^-+[ \t]*id:[ \t]*/, "", id)
                  id = trim(id)
                  gsub(/^"|"$/, "", id)
                  in_app = (id == app)
                  next
                }
          
                # If inside matching app block, grab iam_file
                if (in_app && line ~ /^iam_file:[ \t]*/) {
                  f = line
                  sub(/^iam_file:[ \t]*/, "", f)
                  f = trim(f)
                  gsub(/^"|"$/, "", f)
                  print f
                  exit
                }
              }
            ' "$yaml_path"
          }

          # Reads an iam manifest yaml and extracts "serviceAccount:" value
          # Also replaces literal "PROJECT_ID" with actual project id (matches your old Node behavior)
          get_service_account_from_iam_file() {
            local iam_file="$1"
            local project_id="$2"

            if [ -z "$iam_file" ] || [ ! -f "$iam_file" ]; then
              echo ""
              return 0
            fi

            local sa=""
            sa="$(awk '
              function trim(s){ gsub(/^[ \t]+|[ \t]+$/,"",s); return s }
              {
                line=$0
                sub(/^[ \t]*/,"",line)
                if (line ~ /^serviceAccount:[ \t]*/) {
                  sub(/^serviceAccount:[ \t]*/,"",line)
                  line=trim(line)
                  gsub(/^"|"$/,"",line)
                  print line
                  exit
                }
              }
            ' "$iam_file" || true)"

            if [ -n "${sa:-}" ]; then
              sa="$(echo "$sa" | sed "s/PROJECT_ID/${project_id}/g")"
            fi

            echo "$sa"
          }
          # -----------------------------------------------------------------------

          echo "Enabling required APIs (idempotent)..."
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            --project="$PROJECT"

          echo "Checking Artifact Registry repo: $REPO in $REGION"
          if ! gcloud artifacts repositories describe "$REPO" \
               --location="$REGION" \
               --project="$PROJECT" >/dev/null 2>&1; then
            echo "Repo $REPO not found, creating..."
            gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --description="Shared app container repository" \
              --project="$PROJECT"
          else
            echo "Repo $REPO already exists."
          fi

          for APP in $APPS; do
            echo "-----"
            echo "Checking infra for app: $APP"

            SECRET_NAME="app-${APP}-config"

            echo "Checking Secret Manager secret: $SECRET_NAME"
            if ! gcloud secrets describe "$SECRET_NAME" --project="$PROJECT" >/dev/null 2>&1; then
              echo "Secret $SECRET_NAME not found, creating with empty JSON payload..."
              echo -n '{}' | gcloud secrets create "$SECRET_NAME" \
                --project="$PROJECT" \
                --data-file=- \
                --replication-policy="automatic"
            else
              echo "Secret $SECRET_NAME already exists."
            fi

            IAM_FILE="$(get_iam_file_for_app "$APP")"
            echo "iam_file from infra/apps.yaml: ${IAM_FILE:-<none>}"

            if [ -n "${IAM_FILE:-}" ]; then
              echo "Resolved IAM file path: $IAM_FILE"
              ls -l "$IAM_FILE" || true
              echo "----- iam file contents -----"
              cat "$IAM_FILE" || true
              echo "-----------------------------"
            fi

            SERVICE_ACCOUNT="$(get_service_account_from_iam_file "${IAM_FILE:-}" "$PROJECT")"

            if [ -n "${SERVICE_ACCOUNT:-}" ]; then
              echo "Ensuring service account exists: $SERVICE_ACCOUNT"
              if ! gcloud iam service-accounts describe "$SERVICE_ACCOUNT" --project="$PROJECT" >/dev/null 2>&1; then
                ACCOUNT_ID="$(echo "$SERVICE_ACCOUNT" | cut -d@ -f1)"
                gcloud iam service-accounts create "$ACCOUNT_ID" \
                  --project="$PROJECT" \
                  --display-name="${APP} service account"
              fi

              echo "Ensuring Cloud Run service $APP uses $SERVICE_ACCOUNT"
              if gcloud run services describe "$APP" --region="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
                CURRENT_SA="$(gcloud run services describe "$APP" \
                  --region="$REGION" \
                  --project="$PROJECT" \
                  --format="value(spec.template.spec.serviceAccountName)")"

                if [ -z "${CURRENT_SA:-}" ] || [ "$CURRENT_SA" != "$SERVICE_ACCOUNT" ]; then
                  gcloud run services update "$APP" \
                    --region="$REGION" \
                    --project="$PROJECT" \
                    --service-account="$SERVICE_ACCOUNT"
                else
                  echo "$APP already uses $SERVICE_ACCOUNT"
                fi
              else
                echo "Cloud Run service $APP not found yet; will set service account on first deploy."
              fi

              echo "Adding IAM policy binding for secret: $SECRET_NAME"
              gcloud secrets add-iam-policy-binding "$SECRET_NAME" \
                --project="$PROJECT" \
                --member="serviceAccount:$SERVICE_ACCOUNT" \
                --role="roles/secretmanager.secretAccessor"
            else
              echo "No service account declared for $APP (or iam_file missing). Skipping SA creation + secret binding."
            fi
          done

          echo "Resolved IAM file path: ${IAM_FILE:-<none>}"
          if [ -n "${IAM_FILE:-}" ]; then
            ls -l "$IAM_FILE" || true
            echo "----- iam file contents -----"
            cat "$IAM_FILE" || true
            echo "-----------------------------"
          fi

          echo "✅ Infra check completed successfully."

      - name: No app changes
        if: steps.changed.outputs.apps == ''
        run: |
          echo "No app directories under apps/ changed. Skipping infra checks."
