name: Deploy to DEV

on:
  push:
    branches:
      - dev

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_DEV }}
  IMAGE_REPO: apps

jobs:
  deploy-dev:
    name: Build & Deploy Changed Apps (DEV)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (DEV)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Determine changed files
        id: changed
        run: |
          git fetch --unshallow || true

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push on branch: diff against initial commit
            git diff --name-only "$AFTER" > changed_files.txt || echo "" > changed_files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt || echo "" > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true

          echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Build & Deploy changed apps
        if: steps.changed.outputs.files != ''
        run: |
          CHANGED_PATHS=$(cat changed_files.txt || echo "")
          if [ -z "$CHANGED_PATHS" ]; then
            echo "No changed files detected. Skipping deploy."
            exit 0
          fi

          echo "Changed paths:"
          echo "$CHANGED_PATHS"

          # Map app directories -> Cloud Run services
          declare -A app_map
          declare -A dockerfile_map

          # ====== REGISTER APPS HERE ======
          # key = repo path, value = service name
          app_map["domains/memberships/new-member-onboarding-app"]="new-member-onboarding-app"
          dockerfile_map["domains/memberships/new-member-onboarding-app"]="domains/memberships/new-member-onboarding-app/Dockerfile"
          # Later:
          # app_map["domains/finance/reimbursements-app"]="reimbursements-app"
          # dockerfile_map["domains/finance/reimbursements-app"]="domains/finance/reimbursements-app/Dockerfile"
          # =================================

          changed_any=false

          for path in "${!app_map[@]}"; do
            service="${app_map[$path]}"
            dockerfile="${dockerfile_map[$path]}"

            # If any changed file is under this path, build & deploy that service
            if echo "$CHANGED_PATHS" | grep -q "^$path"; then
              changed_any=true
              echo "Detected changes in $path -> building & deploying: $service"

              IMAGE="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPO}/${service}:${GITHUB_SHA}"
              echo "Building image: $IMAGE using Dockerfile: $dockerfile"

              # Build container with Cloud Build using the monorepo as context
              gcloud builds submit . \
                --tag "$IMAGE" \
                --file "$dockerfile"

              echo "Deploying to Cloud Run service: $service"

              gcloud run deploy "$service" \
                --image "$IMAGE" \
                --region "$GCP_REGION" \
                --platform managed \
                --allow-unauthenticated
            fi
          done

          if [ "$changed_any" = false ]; then
            echo "No app folders in app_map changed. Nothing to deploy."
          fi