name: Terraform (dev)

on:
  push:
    branches:
      - dev
    paths:
      - "infra/terraform/**"

  # Uncomment when dev is validated and prod is ready:
  # push:
  #   branches:
  #     - prod
  #   paths:
  #     - "infra/terraform/**"

  pull_request:
    branches:
      - dev
    paths:
      - "infra/terraform/**"

permissions:
  contents: read
  pull-requests: write  # Required to post plan output as a PR comment

env:
  TF_WORKSPACE: "psm-dev"
  WORKING_DIR: "infra/terraform/envs/dev"
  TF_CLOUD_ORGANIZATION: "polish-youth-assn"

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_KEY }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n...(truncated)'
              : plan;
            const body = `### Terraform Plan — \`${{ env.TF_WORKSPACE }}\`\n\`\`\`\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -no-color
