# Deploy psm-portal (static export) to GitHub Pages — the ONLY deploy pipeline.
# Merge to `main` -> auto-deploy. Enable in repo Settings -> Pages -> Source: "GitHub Actions",
# and add a CNAME for the custom domain.
#
# The portal is now a static export (next.config `output: "export"`, no /api routes), so merges to
# `main` build `apps/psm-portal/out` and publish it to GitHub Pages.
#
# The deployed site needs two repo Actions *variables* to be functional:
#   WIX_FUNCTIONS_BASE     -> your Wix site's /_functions base
#   GOOGLE_OAUTH_CLIENT_ID -> the Google Sign-In web client id
# Until those are set (and the Wix backend is live + DNS pointed), the build still succeeds but the
# app can't reach a backend.
name: Deploy Portal to GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        working-directory: apps/psm-portal
        env:
          NEXT_PUBLIC_WIX_FUNCTIONS_BASE: ${{ vars.WIX_FUNCTIONS_BASE }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/psm-portal/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
