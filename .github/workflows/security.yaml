name: Security Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  security-events: write  # Required to upload SARIF to GitHub Security tab
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. SECRET DETECTION — Gitleaks
  #    Scans full git history for hardcoded secrets, API keys, tokens.
  # ─────────────────────────────────────────────────────────────────
  secret-detection:
    name: 🔐 Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required by Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # ↑ Uncomment if running on a private org repo (requires paid Gitleaks license)

  # ─────────────────────────────────────────────────────────────────
  # 2. DEPENDENCY VULNERABILITIES — pnpm audit
  #    Audits the full workspace for known CVEs in npm dependencies.
  #    Report saved as a downloadable Actions artifact.
  # ─────────────────────────────────────────────────────────────────
  dependency-audit:
    name: 📦 Dependency Audit (pnpm audit)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate 2>&1 | tee audit-report.txt
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: audit-report.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 3. STATIC CODE ANALYSIS — Semgrep OSS (SAST)
  #    100% free, no GitHub Advanced Security required.
  #    Detects injection flaws, insecure patterns, and logic bugs
  #    in TypeScript/JavaScript using the official security ruleset.
  #    Results saved as a downloadable Actions artifact.
  #
  #    NOTE: CodeQL was removed because uploading SARIF to GitHub's
  #    Security tab requires GitHub Advanced Security (paid) on
  #    private repos. Semgrep OSS runs entirely within CI with no
  #    external service or account needed.
  # ─────────────────────────────────────────────────────────────────
  sast-semgrep:
    name: 🔬 SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS
        run: |
          semgrep ci \
            --config "p/typescript" \
            --config "p/secrets" \
            --config "p/nodejs" \
            --config "p/owasp-top-ten" \
            --json \
            --output semgrep-report.json \
            --no-suppress-errors \
            || true  # Never fail — report only
        env:
          # No SEMGREP_APP_TOKEN needed — OSS mode runs fully offline
          SEMGREP_SEND_METRICS: "off"

      - name: Print Semgrep summary
        if: always()
        run: |
          if [ -f semgrep-report.json ]; then
            TOTAL=$(jq '.results | length' semgrep-report.json)
            echo "### Semgrep found $TOTAL issue(s)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '
              .results[] |
              "- **\(.check_id)** in `\(.path)` line \(.start.line): \(.extra.message)"
            ' semgrep-report.json >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 4. CONTAINER IMAGE SCANNING — Trivy
  #    Builds each changed app's Docker image and scans it for CVEs
  #    in OS packages and language-level dependencies.
  #    Only apps with changed files are scanned (mirrors deploy logic).
  #    SARIF results upload to GitHub Security → Code scanning tab.
  # ─────────────────────────────────────────────────────────────────
  detect-changed-apps:
    name: 🔍 Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      changed_apps: ${{ steps.detect.outputs.changed_apps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for reliable diffing

      - name: Detect changed apps/
        id: detect
        run: |
          # Use GitHub's push event before/after SHAs for accurate diffing.
          # Falls back to scanning all apps if this is the very first push
          # (before SHA is a string of zeroes) or if the base is unavailable.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # Check if BEFORE is a real commit (not the null SHA on first push)
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Diffing $BEFORE..$AFTER"
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" \
              | grep '^apps/' \
              | cut -d/ -f1-2 \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            echo "No valid base commit — scanning all apps (first push or force push)"
            CHANGED=$(find apps -mindepth 1 -maxdepth 1 -type d \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "changed_apps=$CHANGED" >> $GITHUB_OUTPUT
          echo "Detected changed apps: $CHANGED"

  container-scan:
    name: 🐳 Container Scan — ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: detect-changed-apps
    if: needs.detect-changed-apps.outputs.changed_apps != '[]'
    continue-on-error: true  # Report only — non-blocking
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changed-apps.outputs.changed_apps) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive app name
        id: meta
        run: |
          APP_NAME=$(basename "${{ matrix.app }}")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "image=kod-psm/$APP_NAME:security-scan" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            "./${{ matrix.app }}"

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'  # Never fail — report only

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ steps.meta.outputs.app_name }}

  # ─────────────────────────────────────────────────────────────────
  # 5. SECURITY SUMMARY
  #    Writes a Markdown summary to the Actions run page so the
  #    team gets a one-glance overview after every push to dev.
  # ─────────────────────────────────────────────────────────────────
  security-summary:
    name: 📋 Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-detection
      - dependency-audit
      - sast-semgrep
      - container-scan
    steps:
      - name: Write job summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Secret Detection (Gitleaks) | \`${{ needs.secret-detection.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependency Audit (pnpm audit) | \`${{ needs.dependency-audit.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 SAST — Semgrep OSS | \`${{ needs.sast-semgrep.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Container Scan (Trivy) | \`${{ needs.container-scan.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ All checks are **report-only** (non-blocking). Review findings in the **Security** tab → **Code scanning**." >> $GITHUB_STEP_SUMMARY
