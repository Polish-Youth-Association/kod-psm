name: Security Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write  # Required to upload SARIF to GitHub Security tab
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. SECRET DETECTION — Gitleaks
  #    Scans full git history for hardcoded secrets, API keys, tokens.
  # ─────────────────────────────────────────────────────────────────
  secret-detection:
    name: 🔐 Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required by Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # ↑ Uncomment if running on a private org repo (requires paid Gitleaks license)

  # ─────────────────────────────────────────────────────────────────
  # 2. DEPENDENCY VULNERABILITIES — pnpm audit
  #    Audits the full workspace for known CVEs in npm dependencies.
  #    Report saved as a downloadable Actions artifact.
  # ─────────────────────────────────────────────────────────────────
  dependency-audit:
    name: 📦 Dependency Audit (pnpm audit)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate 2>&1 | tee audit-report.txt
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: audit-report.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 3. STATIC CODE ANALYSIS — Semgrep OSS (SAST)
  #    100% free, no GitHub Advanced Security required.
  #    Detects injection flaws, insecure patterns, and logic bugs
  #    in TypeScript/JavaScript using the official security ruleset.
  #    Results saved as a downloadable Actions artifact.
  #
  #    NOTE: CodeQL was removed because uploading SARIF to GitHub's
  #    Security tab requires GitHub Advanced Security (paid) on
  #    private repos. Semgrep OSS runs entirely within CI with no
  #    external service or account needed.
  # ─────────────────────────────────────────────────────────────────
  sast-semgrep:
    name: 🔬 SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS
        run: |
          semgrep ci \
            --config "p/typescript" \
            --config "p/secrets" \
            --config "p/nodejs" \
            --config "p/owasp-top-ten" \
            --json \
            --output semgrep-report.json \
            --no-suppress-errors \
            || true  # Never fail — report only
        env:
          # No SEMGREP_APP_TOKEN needed — OSS mode runs fully offline
          SEMGREP_SEND_METRICS: "off"

      - name: Print Semgrep summary
        if: always()
        run: |
          if [ -f semgrep-report.json ]; then
            TOTAL=$(jq '.results | length' semgrep-report.json)
            echo "### Semgrep found $TOTAL issue(s)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '
              .results[] |
              "- **\(.check_id)** in `\(.path)` line \(.start.line): \(.extra.message)"
            ' semgrep-report.json >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 4. CONTAINER IMAGE SCANNING — Trivy
  #    Scans every app in apps/ on every push to dev.
  #    Builds each Dockerfile locally, runs Trivy, and saves a
  #    per-app JSON report as a downloadable Actions artifact.
  # ─────────────────────────────────────────────────────────────────
  container-scan:
    name: 🐳 Container Scan (all apps)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-dummy.json
          exit-code: '0'
        continue-on-error: true

      - name: Scan all app containers with Trivy
        run: |
          for APP_DIR in apps/*/; do
            APP_NAME=$(basename "$APP_DIR")

            if [ ! -f "$APP_DIR/Dockerfile" ]; then
              echo "⚠️  Skipping $APP_NAME — no Dockerfile found"
              continue
            fi

            echo "🐳 Building image for: $APP_NAME"
            IMAGE="kod-psm/$APP_NAME:security-scan"

            docker build -t "$IMAGE" "$APP_DIR" || {
              echo "❌ Docker build failed for $APP_NAME"
              continue
            }

            echo "🔍 Scanning $APP_NAME with Trivy..."
            trivy image \
              --format json \
              --output "trivy-$APP_NAME.json" \
              --severity CRITICAL,HIGH,MEDIUM \
              --exit-code 0 \
              "$IMAGE" || true

            TOTAL=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' "trivy-$APP_NAME.json" 2>/dev/null || echo "?")
            echo "📋 $APP_NAME: $TOTAL vulnerability/ies found"
          done

      - name: Write container scan summary
        if: always()
        run: |
          echo "### 🐳 Container Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Critical | High | Medium |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          for REPORT in trivy-*.json; do
            [ -f "$REPORT" ] || continue
            APP=$(echo "$REPORT" | sed 's/trivy-//;s/\.json//')
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="CRITICAL")] | length' "$REPORT" 2>/dev/null || echo "?")
            HIGH=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="HIGH")] | length' "$REPORT" 2>/dev/null || echo "?")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="MEDIUM")] | length' "$REPORT" 2>/dev/null || echo "?")
            echo "| \`$APP\` | $CRITICAL | $HIGH | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-reports
          path: trivy-*.json
          retention-days: 30


  # ─────────────────────────────────────────────────────────────────
  # 5. INFRASTRUCTURE AS CODE — Trivy IaC scan
  #    Scans infra/ for Cloud Run and Cloud Build misconfigurations:
  #    overly permissive IAM, missing resource limits, insecure
  #    settings, and exposed ports. Uses Trivy (already in pipeline).
  # ─────────────────────────────────────────────────────────────────
  iac-scan:
    name: 🏗️ IaC Scan (Trivy)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy IaC scan on infra/
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-iac-report.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Print IaC scan total
        run: |
          TOTAL=$(jq '[.Results[]?.Misconfigurations // [] | .[]] | length' trivy-iac-report.json 2>/dev/null || echo "0")
          echo "📋 IaC scan complete: $TOTAL misconfiguration(s) found"

      - name: Write IaC summary
        if: always()
        run: |
          echo "### 🏗️ IaC Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-iac-report.json ]; then
            TOTAL=$(jq '[.Results[]?.Misconfigurations // [] | .[]] | length' trivy-iac-report.json 2>/dev/null || echo "0")
            if [ "$TOTAL" -eq 0 ]; then
              echo "✅ No misconfigurations found." >> $GITHUB_STEP_SUMMARY
            else
              echo "| File | ID | Severity | Title |" >> $GITHUB_STEP_SUMMARY
              echo "|------|----|----------|-------|" >> $GITHUB_STEP_SUMMARY
              jq -r '
                .Results[]? |
                .Target as $file |
                .Misconfigurations[]? |
                "| `\($file)` | \(.ID) | \(.Severity) | \(.Title) |"
              ' trivy-iac-report.json >> $GITHUB_STEP_SUMMARY || true
            fi
          else
            echo "⚠️ No report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-iac-report
          path: trivy-iac-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 6. GITHUB ACTIONS WORKFLOW HARDENING — zizmor
  #    Audits all .github/workflows/*.yaml files for common security
  #    issues: script injection via untrusted inputs, overly broad
  #    permissions, unpinned action versions, and dangerous patterns
  #    that could allow workflow compromise.
  # ─────────────────────────────────────────────────────────────────
  workflow-hardening:
    name: ⚙️ Workflow Hardening (zizmor)
    runs-on: ubuntu-latest
    continue-on-error: true  # Report only — non-blocking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install zizmor
        run: pip install zizmor --quiet

      - name: Run zizmor on all workflows
        run: |
          # --format plain produces ANSI colour codes — pipe through sed to strip them
          # before saving so the report is readable in both the summary and artifact.
          zizmor \
            --format plain \
            --no-exit-codes \
            .github/workflows/ 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | tee zizmor-report.txt || true

          # Count finding lines (they start with "warning", "error", or "info")
          TOTAL=$(grep -cE '^(error|warning|info)\[' zizmor-report.txt 2>/dev/null || echo "0")
          echo "📋 zizmor complete: $TOTAL finding(s)"

      - name: Write workflow hardening summary
        if: always()
        run: |
          echo "### ⚙️ Workflow Hardening Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s zizmor-report.txt ]; then
            # Build a clean Markdown table from the plain-text findings
            echo "| Severity | File | Line | Rule | Detail |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------|------|------|--------|" >> $GITHUB_STEP_SUMMARY
            # Each finding header looks like: error[rule]: description
            # Followed by a line like:   --> path/to/file.yaml:line:col
            paste -d'|' \
              <(grep -E '^(error|warning|info)\[' zizmor-report.txt | sed 's/\[/|/;s/\]://') \
              <(grep -E '^  --> ' zizmor-report.txt | sed 's/^  --> //;s/:[0-9]*:[0-9]*$//') \
              <(grep -E '^  --> ' zizmor-report.txt | grep -oE ':[0-9]+:' | tr -d ':') \
              2>/dev/null | awk -F'|' '{
                printf "| `%s` | `%s` | %s | `%s` | %s | ", $1, $3, $4, $2, $1
              }' >> $GITHUB_STEP_SUMMARY || true

            # Also include the full plain-text output in a collapsible block
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Full zizmor output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat zizmor-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No issues found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload zizmor report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zizmor-workflow-report
          path: zizmor-report.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 7. SECURITY SUMMARY
  #    Writes a Markdown summary to the Actions run page so the
  #    team gets a one-glance overview after every push to dev.
  # ─────────────────────────────────────────────────────────────────
  security-summary:
    name: 📋 Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-detection
      - dependency-audit
      - sast-semgrep
      - container-scan
      - iac-scan
      - workflow-hardening
    steps:
      - name: Write job summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Secret Detection (Gitleaks) | \`${{ needs.secret-detection.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependency Audit (pnpm audit) | \`${{ needs.dependency-audit.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 SAST — Semgrep OSS | \`${{ needs.sast-semgrep.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Container Scan (Trivy) | \`${{ needs.container-scan.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ IaC Scan (Trivy) | \`${{ needs.iac-scan.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Workflow Hardening (zizmor) | \`${{ needs.workflow-hardening.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ All checks are **report-only** (non-blocking). Review findings in the **Security** tab → **Code scanning**." >> $GITHUB_STEP_SUMMARY
