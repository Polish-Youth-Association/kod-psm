project_id: psm-prod
location: us-central1

# Firestore named databases for the PSM platform.
# Each database is provisioned separately in Firebase.
# Apps connect to these via initFirestore() from @kod-psm/gcp-helpers.

databases:
  - id: psm-member-platform
    description: "Member records and onboarding data ingested from Wix"
    collections:
      - name: members
        description: "One document per PSM member. Keyed by Wix submission ID."
        indexes:
          # Required for GET /api/members/pending (onboardingStatus filter + createdAt sort)
          - fields: [onboardingStatus ASC, createdAt DESC]
      - name: counters
        description: "Per-prefix atomic counters for member ID assignment (e.g. counters/DNY)."

  - id: psm-chat-sessions
    description: "AI assistant chat sessions per IAP-authenticated user"
    collections:
      - name: sessions
        description: >
          One document per session.
          Path: sessions/{sessionId}
          Fields: userEmail, title, createdAt, updatedAt, messages[]
        indexes:
          # Required for GET /v1/sessions?userEmail=... ordered by updatedAt
          - fields: [userEmail ASC, updatedAt DESC]
